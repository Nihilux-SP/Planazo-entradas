services:
  - type: web
    name: planazo
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: .
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/app/data/planazo;MODE=PostgreSQL;AUTO_SERVER=TRUE
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
