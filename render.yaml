services:
  - type: web
    name: planazo
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: .
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /app/data/planazo.sqlite3
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
